<script>(function(root){
'use strict';
root.createStudyClock=function({initial={},now=()=>performance.now(),day=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},persist=()=>{}}={}){
 let elapsed=Number.isFinite(initial?.elapsedMs)?Math.max(0,initial.elapsedMs):0,running=false,last=0;
 const days={};for(const [key,value] of Object.entries(initial?.days||{}))if(/^\d{4}-\d{2}-\d{2}$/.test(key)&&Number.isFinite(value)&&value>=0)days[key]=value;
 function snapshot(){return {elapsedMs:elapsed,days:{...days}}}
 function tick(){if(running){const current=now(),delta=Math.max(0,current-last);last=current;elapsed+=delta;const key=day();days[key]=(days[key]||0)+delta}return {elapsedMs:elapsed,todayMs:days[day()]||0,running}}
 function checkpoint(){tick();persist(snapshot())}
 function start(){if(!running){last=now();running=true;checkpoint()}return tick()}
 function pause(){tick();running=false;checkpoint();return tick()}
 function finish(){pause();const duration=elapsed;elapsed=0;checkpoint();return duration}
 return {tick,start,pause,finish,checkpoint,snapshot};
};
})(globalThis);

(()=>{
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const bank=JSON.parse($('bank').textContent),sections=[...new Set(bank.map(q=>q.category))].sort((a,b)=>a.localeCompare(b,'tr'));
function load(key,fallback){try{return JSON.parse(localStorage.getItem('pediatri-'+key))??fallback}catch{return fallback}}
function save(key,value){try{localStorage.setItem('pediatri-'+key,JSON.stringify(value))}catch{}}
let prefs=load('preferences',{});if(!prefs||typeof prefs!=='object')prefs={};
let progress=load('progress',{});if(!progress||typeof progress!=='object')progress={};
let route='cards',topic=sections.includes(progress.cards?.topic)?progress.cards.topic:'all',deck=topic==='all'?[...bank]:bank.filter(q=>q.category===topic),index=0,open=false;
index=Math.max(0,deck.findIndex(q=>q.id===progress.cards?.id));
let immersiveType=null,readingTransition=false,focusPending=false,focusEntry=false,focusGeneration=0,focusOperation=0,ignoreCardClickUntil=0;
let font=Math.min(1.4,Math.max(.85,Number(prefs.font)||1)),toastTimer,resizeTimer;
document.documentElement.style.setProperty('--card-font',font);
function toast(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2800)}

const studyClock=createStudyClock({initial:load('study-clock',{}),persist:state=>save('study-clock',state)});
function formatDuration(ms){const seconds=Math.floor(Math.max(0,ms)/1000);return [Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60].map(n=>String(n).padStart(2,'0')).join(':')}
function drawStudyTime(){const state=studyClock.tick();$('studyTime').textContent=formatDuration(state.elapsedMs);$('todayTime').textContent='Bugün '+formatDuration(state.todayMs);$('studyToggle').textContent=state.running?'Duraklat':state.elapsedMs>0?'Devam et':'Çalışmaya başla';$('studyState').textContent=state.running?'Çalışıyorsun':state.elapsedMs>0?'Duraklatıldı':'Çalışma süresi';$('studyDot').classList.toggle('running',state.running);$('studyFinish').disabled=state.elapsedMs<=0&&!state.running}
$('studyToggle').onclick=()=>{if(studyClock.tick().running)studyClock.pause();else studyClock.start();drawStudyTime()};
$('studyFinish').onclick=()=>{const duration=studyClock.finish();drawStudyTime();toast('Çalışma tamamlandı: '+formatDuration(duration))};
setInterval(()=>{if(studyClock.tick().running)studyClock.checkpoint();drawStudyTime()},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&studyClock.tick().running){studyClock.pause();drawStudyTime()}});
window.addEventListener('pagehide',()=>{if(studyClock.tick().running)studyClock.pause()});drawStudyTime();

function updateHome(){}
function drawCard(){const q=deck[index];
 $('counter').textContent=`${index+1} / ${deck.length}`;$('previous').disabled=index===0;$('next').disabled=index===deck.length-1;
 $('number').textContent='SORU '+String(q.id).padStart(3,'0');$('category').textContent=q.category;
 $('card').classList.toggle('answer',open);$('card').setAttribute('aria-label',open?'Cevap açık. Soruyu görmek için dokun.':'Cevabı görmek için dokun.');$('card').setAttribute('aria-expanded',String(open));
 $('side').textContent=open?'CEVAP':'SORU';$('flip').textContent=open?'Soruyu göster':'Cevabı göster';$('removed').classList.toggle('hidden',!q.removed);
 $('question').textContent=q.question;$('followups').innerHTML=(q.followups||[]).map(x=>`<li>${esc(x)}</li>`).join('');$('followups').classList.toggle('hidden',!(q.followups||[]).length);
 $('answer').classList.toggle('hidden',!open);$('answer').innerHTML=open?'<ul>'+q.items.map(x=>`<li>${x.context?`<p class="context">${esc(x.context)}</p>`:''}${esc(x.text)}</li>`).join('')+'</ul>':'';
 $('hint').textContent=open?'Soruyu görmek için karta dokun.':'Cevabı görmek için karta dokun.';
 progress={...progress,...load('progress',{}),cards:{id:q.id,topic}};save('progress',progress);updateHome();
}
function flip(){open=!open;drawCard()}
function moveCard(step){let next=index+step;if(next<0||next>=deck.length)return;index=next;open=false;drawCard();$('card').scrollTop=0;window.scrollTo({top:0})}
$('topic').innerHTML='<option value="all">Bütün bölümler</option>'+sections.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');$('topic').value=topic;
$('topic').onchange=()=>{topic=$('topic').value;deck=topic==='all'?[...bank]:bank.filter(q=>q.category===topic);index=0;open=false;drawCard()};
$('shuffle').onclick=()=>{for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}index=0;open=false;drawCard();toast('Kartlar karıştırıldı.')};
$('card').onclick=()=>{if(Date.now()>=ignoreCardClickUntil&&!String(window.getSelection()).trim())flip()};
let swipeStart=null;$('card').addEventListener('pointerdown',e=>{if(immersiveType==='cards')swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId}});$('card').addEventListener('pointercancel',()=>swipeStart=null);$('card').addEventListener('pointerup',e=>{if(!swipeStart||e.pointerId!==swipeStart.id)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){ignoreCardClickUntil=Date.now()+400;moveCard(dx<0?1:-1)}});$('flip').onclick=flip;$('previous').onclick=()=>moveCard(-1);$('next').onclick=()=>moveCard(1);
function resizeFont(step){font=Math.min(1.4,Math.max(.85,Math.round((font+step)*100)/100));document.documentElement.style.setProperty('--card-font',font);prefs.font=font;save('preferences',prefs);$('fontDown').disabled=font<=.85;$('fontUp').disabled=font>=1.4}
$('fontDown').onclick=()=>resizeFont(-.1);$('fontUp').onclick=()=>resizeFont(.1);resizeFont(0);
function themeLabel(){$('themeLabel').textContent=document.documentElement.dataset.theme==='dark'?'Gündüz modu':'Gece modu';$('themeButton').setAttribute('aria-pressed',String(document.documentElement.dataset.theme==='dark'));document.querySelector('meta[name="theme-color"]').content=document.documentElement.dataset.theme==='dark'?'#15231d':'#f4f5ef'}
$('themeButton').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('pediatri-theme',document.documentElement.dataset.theme)}catch{}themeLabel()};themeLabel();

function fullLabel(){
 const active=!!immersiveType;
 $('fullLabel').textContent=active?'Ekrandan çık':'Tam ekran';
 $('fullButton').classList.remove('hidden');
 $('fullButton').setAttribute('aria-pressed',String(active));
 $('fullButton').title='Yalnızca flaş kartı tam ekranda aç';
}
function fallbackHistory(){
 if(!history.state?.pediatriFocus){history.pushState({...history.state,pediatriFocus:true},'',location.href);focusEntry=true}
}
async function enterFocus(){
 if(immersiveType||focusPending)return;
 focusPending=true;immersiveType='cards';
 document.documentElement.classList.add('content-fullscreen');
 document.body.classList.add('immersive');document.body.dataset.focus='cards';
 try{if($('card').requestFullscreen)await $('card').requestFullscreen();if(!document.fullscreenElement)fallbackHistory()}
 catch{fallbackHistory()}
 finally{focusPending=false;fullLabel();$('card').focus({preventScroll:true})}
}
async function exitFocus({fromHistory=false,nativeExit=false}={}){
 if(!immersiveType||focusPending)return;
 focusPending=true;
 try{if(document.fullscreenElement&&!nativeExit)await document.exitFullscreen()}catch{}
 finally{
  document.documentElement.classList.remove('content-fullscreen');
  document.body.classList.remove('immersive');delete document.body.dataset.focus;
  immersiveType=null;focusPending=false;fullLabel();
  const goBack=focusEntry&&!fromHistory&&history.state?.pediatriFocus;focusEntry=false;
  if(goBack)history.back();
  $('fullButton').focus({preventScroll:true});
 }
}
$('fullButton').onclick=()=>immersiveType?exitFocus():enterFocus();
document.addEventListener('fullscreenchange',()=>{if(immersiveType&&!document.fullscreenElement&&!focusPending)exitFocus({nativeExit:true})});
window.addEventListener('popstate',()=>{if(immersiveType&&focusEntry&&!history.state?.pediatriFocus)exitFocus({fromHistory:true})});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&immersiveType){if(!document.fullscreenElement){e.preventDefault();exitFocus()}return}
 if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.key==='ArrowRight'){e.preventDefault();moveCard(1)}
 else if(e.key==='ArrowLeft'){e.preventDefault();moveCard(-1)}
 else if((e.key===' '||e.key==='Enter')&&e.target.id==='card'){e.preventDefault();flip()}
 else if(e.key===' '&&e.target===document.body){e.preventDefault();flip()}
});
function normalizeRoute(){
 if(location.hash!=='#cards')history.replaceState(history.state,'',location.pathname+location.search+'#cards');
}
normalizeRoute();window.addEventListener('hashchange',normalizeRoute);
if(history.state?.pediatriFocus){const state={...history.state};delete state.pediatriFocus;history.replaceState(state,'',location.href)}
fullLabel();drawCard();
})();
</script>
